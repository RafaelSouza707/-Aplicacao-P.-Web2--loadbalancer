events {}

http {

    log_format custom '$http_x_forwarded_for - $remote_addr - [$time_local] "$request"';

    access_log /dev/stdout custom;

    upstream frontend_nodes {
        server node1:80 weight=5;
        server node2:80 weight=4;
        server node3:80 weight=3;
        server node4:80 weight=2;
        server node5:80 weight=1;
    }

    server {

        listen 80;

        location / {

            proxy_pass http://frontend_nodes;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";
        }
    }
}
